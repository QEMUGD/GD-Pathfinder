name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

          - name: iOS
            os: macos-latest
            target: iOS

    steps:
      - uses: actions/checkout@v7

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Combine platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: maimaidxer.gdpathfinder.geode
          path: ${{ steps.combine.outputs.build-output }}

  release:
    name: Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: maimaidxer.gdpathfinder.geode

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: maimaidxer.gdpathfinder.geode
          fail_on_unmatched_files: true
